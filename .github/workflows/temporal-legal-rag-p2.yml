name: Temporal Legal RAG P2 regression

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/src/ai_legal_helper/legal_knowledge/**"
      - "backend/src/ai_legal_helper/database/models.py"
      - "backend/alembic/versions/90d4e30c2a71_add_official_law_catalog.py"
      - "backend/tests/unit/test_law_catalog_p2.py"
      - "backend/tests/unit/test_law_catalog_migration_p2.py"
      - ".github/workflows/temporal-legal-rag-p2.yml"
  push:
    branches: [main, feature/temporal-legal-rag-p2-law-catalog]
    paths:
      - "backend/src/ai_legal_helper/legal_knowledge/**"
      - "backend/src/ai_legal_helper/database/models.py"
      - "backend/alembic/versions/90d4e30c2a71_add_official_law_catalog.py"
      - "backend/tests/unit/test_law_catalog_p2.py"
      - ".github/workflows/temporal-legal-rag-p2.yml"

permissions:
  contents: read

jobs:
  law-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal offline-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio "sqlalchemy>=2.0" "psycopg[binary]>=3.1" python-dotenv "pydantic>=2.5" "alembic>=1.13"
      - name: P2 catalog and resolver regression
        env:
          PYTHONPATH: backend/src
          TESTING: "1"
        run: |
          python -m pytest -q backend/tests/unit/test_law_catalog_p2.py backend/tests/unit/test_law_catalog_migration_p2.py
