name: Temporal RAG P8 verification
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/src/ai_legal_helper/legal_knowledge/temporal_verification.py"
      - "backend/src/ai_legal_helper/workflows/legal_workflow.py"
      - "backend/src/ai_legal_helper/workflows/document_consultation.py"
      - "backend/tests/unit/test_temporal_verification_p8.py"
      - ".github/workflows/temporal-rag-p8.yml"
  push:
    branches: [main, feature/temporal-rag-p8-verification-gate]
    paths:
      - "backend/src/ai_legal_helper/legal_knowledge/temporal_verification.py"
      - "backend/src/ai_legal_helper/workflows/legal_workflow.py"
      - "backend/src/ai_legal_helper/workflows/document_consultation.py"
      - "backend/tests/unit/test_temporal_verification_p8.py"
      - ".github/workflows/temporal-rag-p8.yml"
permissions:
  contents: read
jobs:
  temporal-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: P8 gate / P7 evidence / P6 HILT safety regressions
        env:
          PYTHONPATH: backend/src
          TESTING: "1"
          LANGFUSE_ENABLED: "false"
          CHECKPOINTER_TYPE: memory
        run: |
          python -m pytest -q             backend/tests/unit/test_temporal_verification_p8.py             backend/tests/unit/test_legal_evidence_bundle_p7.py             backend/tests/unit/test_temporal_hilt_workflow_p6.py             backend/tests/unit/test_temporal_law_resolver_p5.py             backend/tests/unit/test_hilt_statute_search.py::test_t04_user_rejection_routes_to_insufficient
