name: Semantic Judgment Safety Regression
on:
  pull_request:
    paths:
      - "backend/src/ai_legal_helper/**"
      - "backend/tests/**"
      - ".github/workflows/semantic-judgment-audit.yml"
permissions:
  contents: read
jobs:
  semantic-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_user
          POSTGRES_PASSWORD: ai_password
          POSTGRES_DB: ai_legal_helper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_user -d ai_legal_helper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ai_user:ai_password@127.0.0.1:5432/ai_legal_helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Initialize ephemeral PostgreSQL tables
        env:
          PYTHONPATH: backend/src
        run: |
          python - <<'PY'
          from ai_legal_helper.database.session import Base, engine
          import ai_legal_helper.database.models  # register ORM models
          Base.metadata.create_all(bind=engine)
          print("Created test tables:", len(Base.metadata.tables))
          PY
      - name: Verification decision characterization regressions
        env:
          PYTHONPATH: backend/src
          TESTING: "1"
          LANGFUSE_ENABLED: "false"
          CHECKPOINTER_TYPE: memory
        run: |
          python -m pytest -q \
            backend/tests/unit/test_verification_decision_trace_contract.py \
            backend/tests/unit/test_verification_pass_promotion_behavior.py \
            backend/tests/unit/test_verification_audit_reuse_contract.py

      - name: Verify meaning classification, cases and statutes
        env:
          PYTHONPATH: backend/src
          TESTING: "1"
          LANGFUSE_ENABLED: "false"
          CHECKPOINTER_TYPE: memory
        run: |
          python -m pytest -q \
            backend/tests/unit/test_semantic_judgment_guardrails.py \
            backend/tests/unit/test_semantic_monetary_priority_p0.py \
            backend/tests/unit/test_temporal_hitl_workflow_p6.py \
            backend/tests/unit/test_step3_statute_search.py \
            backend/tests/unit/test_temporal_verification_p8.py \
            backend/tests/unit/test_temporal_law_resolver_p5.py \
            backend/tests/unit/test_statute_temporal_p0_law_02.py \
            backend/tests/unit/test_repayment_dialogue_conflict_regression.py \
            backend/tests/unit/test_conflict_detector_v1_2.py \
            backend/tests/unit/test_case_independence_counterexamples.py \
            backend/tests/unit/test_trace_dae222e6_quality_and_latency.py

      - name: Python source syntax validation
        run: python -m compileall -q backend/src/ai_legal_helper
      - name: Extended cross-module compatibility regressions
        env:
          PYTHONPATH: backend/src
          TESTING: "1"
          LANGFUSE_ENABLED: "false"
          CHECKPOINTER_TYPE: memory
        run: |
          python -m pytest -q \
            backend/tests/unit/test_parties_timeline_sync.py \
            backend/tests/unit/test_evidence_adjudication.py \
            backend/tests/unit/test_installment_proposal_conflict_regression.py \
            backend/tests/unit/test_conflict_detector.py \
            backend/tests/unit/test_issue_verification.py \
            backend/tests/unit/test_intent_analyzer.py \
            backend/tests/unit/test_multi_turn_dynamic_case_p0_3.py \
            backend/tests/unit/test_verified_presentation.py \
            backend/tests/unit/test_document_consultation.py \
            backend/tests/unit/test_evidence_structured_graphrag.py \
            backend/tests/unit/test_evidence_grounding_p3.py \
            backend/tests/unit/test_evidence_subset_consultation.py \
            backend/tests/unit/test_official_statute_search.py \
            backend/tests/unit/test_official_statute_temporal_metadata_p1.py \
            backend/tests/unit/test_official_statute_versions_p4.py \
            backend/tests/test_document_answer_prompt_no_case_hardcoding.py \
            backend/tests/test_document_partial_revision.py \
            backend/tests/test_temporal_llm_event_extraction.py \
            backend/tests/test_temporal_snapshot_consistency.py
