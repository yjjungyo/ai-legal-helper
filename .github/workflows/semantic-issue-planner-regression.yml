name: Semantic Issue Planner Regression

on:
  pull_request:
    paths:
      - "backend/src/ai_legal_helper/agents/intent_analyzer.py"
      - "backend/src/ai_legal_helper/workflows/issue_planner.py"
      - "backend/src/ai_legal_helper/workflows/legal_workflow.py"
      - "backend/tests/unit/test_semantic_issue_planner_sc012.py"
      - ".github/workflows/semantic-issue-planner-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANGFUSE_ENABLED: "false"
      TESTING: "1"
      CHECKPOINTER_TYPE: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend tests
        run: python -m pip install -e './backend[dev]'
      - name: Compile semantic planner and workflow
        run: |
          python -m py_compile \
            backend/src/ai_legal_helper/agents/intent_analyzer.py \
            backend/src/ai_legal_helper/workflows/issue_planner.py \
            backend/src/ai_legal_helper/workflows/legal_workflow.py \
            backend/tests/unit/test_semantic_issue_planner_sc012.py
      - name: Cross-domain issue planning and context regressions
        run: |
          PYTHONPATH=backend/src python -m pytest -q \
            backend/tests/unit/test_semantic_issue_planner_sc012.py \
            backend/tests/unit/test_stage1_issue_formulation.py \
            backend/tests/unit/test_intent_analyzer.py
