name: Presentation Regression

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/src/ai_legal_helper/presentation/**'
      - 'backend/src/ai_legal_helper/api/schemas/consultation.py'
      - 'backend/src/ai_legal_helper/api/routes/consultation.py'
      - 'backend/src/ai_legal_helper/database/models.py'
      - 'backend/tests/unit/test_verified_presentation.py'
      - 'backend/tests/unit/test_p4_presentation_semantics.py'
      - 'backend/tests/unit/test_presentation_source_contract.py'
      - 'backend/tests/unit/test_p4_presentation_snapshot.py'
      - 'backend/tests/unit/test_p4_case_evidence_manifest.py'
      - 'backend/alembic/versions/c402b8e5a201_persist_consultation_presentation_snapshot.py'
      - 'backend/alembic/versions/d4c3e2a1f903_add_case_evidence_baseline.py'
      - '.github/workflows/presentation-regression.yml'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: TypeScript and Vite build
        run: npm run build
        working-directory: frontend
      - name: Presentation regression
        run: node --test tests/legal-answer-view.test.cjs tests/presentation-layout.test.cjs tests/consultation-sources.test.cjs tests/presentation-semantics.test.cjs
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal Pydantic tests
        run: python -m pip install 'pydantic>=2.5,<3' 'pytest>=8,<10' 'alembic>=1.13,<2'
      - name: Verify lossless presentation and semantic contract
        run: PYTHONPATH=backend/src python -m pytest backend/tests/unit/test_presentation_source_contract.py backend/tests/unit/test_verified_presentation.py backend/tests/unit/test_p4_presentation_semantics.py backend/tests/unit/test_p4_presentation_snapshot.py backend/tests/unit/test_p4_case_evidence_manifest.py -q
      - name: Check single Alembic head and migration syntax
        run: |
          python -m py_compile backend/alembic/versions/c402b8e5a201_persist_consultation_presentation_snapshot.py
          python -m py_compile backend/alembic/versions/d4c3e2a1f903_add_case_evidence_baseline.py
          python -m py_compile backend/src/ai_legal_helper/presentation/evidence_manifest.py
          python -m py_compile backend/src/ai_legal_helper/api/routes/consultation.py
          python -m py_compile backend/src/ai_legal_helper/database/models.py
          alembic -c backend/alembic.ini heads
          test "$(alembic -c backend/alembic.ini heads | wc -l)" -eq 1
