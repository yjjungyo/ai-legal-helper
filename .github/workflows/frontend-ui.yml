name: Frontend UI regression

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ui.yml'
  push:
    branches:
      - 'feature/ui01-case-workspace'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ui.yml'

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: Lint
        run: npm run lint
