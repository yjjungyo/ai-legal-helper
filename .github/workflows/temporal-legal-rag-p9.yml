name: Temporal Legal RAG P9 index worker regression
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/src/ai_legal_helper/legal_knowledge/index_jobs.py"
      - "backend/src/ai_legal_helper/legal_knowledge/index_worker.py"
      - "backend/tests/unit/test_official_law_index_worker_p9.py"
      - ".github/workflows/temporal-legal-rag-p9.yml"
  push:
    branches: [main, feature/temporal-legal-rag-p9-index-worker]
    paths:
      - "backend/src/ai_legal_helper/legal_knowledge/index_jobs.py"
      - "backend/src/ai_legal_helper/legal_knowledge/index_worker.py"
      - "backend/tests/unit/test_official_law_index_worker_p9.py"
      - ".github/workflows/temporal-legal-rag-p9.yml"
permissions:
  contents: read
jobs:
  full-statute-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/requirements.txt
      - name: P9 Mock Chroma and SQLite
        env:
          PYTHONPATH: backend/src
          TESTING: "1"
          LANGFUSE_ENABLED: "false"
        run: python -m pytest -q backend/tests/unit/test_official_law_index_worker_p9.py
