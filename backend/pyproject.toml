[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-legal-helper"
version = "0.1.0"
description = "AI Legal Helper - Foundation and Observability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langgraph>=0.0.26",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "python-json-logger>=2.0.7",
    "pydantic>=2.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "neo4j>=5.20.0",
    "chromadb>=0.5.0",
    "langfuse>=2.0.0,<3.0.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.1.0",
    "reportlab>=4.1.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_legal_helper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

