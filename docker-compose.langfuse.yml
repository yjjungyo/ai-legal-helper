# postgres와 기본 네트워크를 공유하므로 기본 Compose 파일과 함께 실행한다.
# docker compose --env-file backend/.env -f docker-compose.yml -f docker-compose.langfuse.yml up -d langfuse

services:
  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ai_user}:${POSTGRES_PASSWORD:-ai_password}@postgres:5432/langfuse
      - NEXTAUTH_SECRET=${LANGFUSE_SECRET:-my_super_secret_langfuse_key_12345}
      - SALT=${LANGFUSE_SALT:-my_super_secret_salt_12345}
      - NEXTAUTH_URL=http://localhost:3001
      - TELEMETRY_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy

