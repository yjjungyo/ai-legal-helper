ont-weight="400" text-anchor="start" fill="#536A7C">사건 개요 · 당사자 · 분쟁 쟁점</text><line x1="499" y1="387" x2="499" y2="398" stroke="#225E91" stroke-width="3" stroke-linecap="round" /><polygon points="499,398 494.2,389.2 503.8,389.2" fill="#225E91"/><rect x="132" y="399" width="735" height="66" rx="13" fill="#FBFDFF" stroke="#225E91" stroke-width="2"/><rect x="132" y="399" width="7" height="66" rx="3" fill="#225E91"/><text x="155" y="430" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#18364E">02  증거 등록과 사실 후보 추출</text><text x="155" y="457" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#536A7C">계약서·문자·거래내역 등 → AI 분석</text><line x1="499" y1="466" x2="499" y2="477" stroke="#225E91" stroke-width="3" stroke-linecap="round" /><polygon points="499,477 494.2,468.2 503.8,468.2" fill="#225E91"/><rect x="132" y="478" width="735" height="66" rx="13" fill="#FBFDFF" stroke="#097A78" stroke-width="2"/><rect x="132" y="478" width="7" height="66" rx="3" fill="#097A78"/><text x="155" y="509" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#18364E">03  사실 검토·승인 및 맥락 정리</text><text x="155" y="536" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#536A7C">승인 사실 · 사건 타임라인 · 증거 관계</text><line x1="499" y1="545" x2="499" y2="556" stroke="#097A78" stroke-width="3" stroke-linecap="round" /><polygon points="499,556 494.2,547.2 503.8,547.2" fill="#097A78"/><rect x="132" y="557" width="735" height="66" rx="13" fill="#FBFDFF" stroke="#684EA1" stroke-width="2"/><rect x="132" y="557" width="7" height="66" rx="3" fill="#684EA1"/><text x="155" y="588" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#18364E">04  AI 법률 상담</text><text x="155" y="615" font-family="Noto Sans CJK